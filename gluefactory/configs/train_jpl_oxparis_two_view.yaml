data:
    name: oxford_paris_2view_jpldd
    data_dir: revisitop1m_POLD2/jpg
    grayscale: False
    triplet: False
    homography:
      difficulty: 0.5
      max_angle: 30
      patch_shape: [800, 800]
    photometric:
        p: 0.75
    train_size: 11500
    val_size: 500
    batch_size: 12  # 16 per 10Gb of GPU mem
    num_workers: 12
    load_features:
        do: True
        thresh: 0.0
        max_num_keypoints: 1000
        force_num_keypoints: True
        point_gt:
            use_score_heatmap: True
        check_exists: True
    seed: 0
model:
    name: two_view_pipeline
    extractor:
        name: joint_point_line_extractor
        model_name: "aliked-n16"
        trainable: True # needs to be set explicitly here as two-view is not trainable
        line_neighborhood: 5
        max_num_keypoints: 1000  # setting for training, for eval: -1
        subpixel_refinement: True # if activated the DKD module will apply arg-softmax refinement of keypoint positions
        use_line_anglefield: False   # if set to false, model will be initialized without AF branch and AF will not be output or considered in inference or training
        line_df_decoder_channels: 64  # number of channels in CNN for af/df decoder branches
        training:
            do: True
            two_view: True
            aliked_pretrained: True  # do we use pretrained-weights from aliked to start training from?
            pretrain_kp_decoder: True
            train_descriptors:
                use_one_view_loss: False # train with direct supervision of descriptors with ground truth descriptors
                use_two_view_loss: True # use sparse nre loss to train descriptors
                gt_aliked_model: "aliked-n32"
            loss:
                use_one_view_df_loss: False # one-view losses can be applied any time
                use_one_view_af_loss: False # af loss is only applied if af use is activated
                use_two_view_df_loss: True # two view losses are only applied if two-view training activated
                use_one_view_kp_loss: True # use one-view keypoint loss ex. focal, l1 etc
                kp_loss_name: "focal_loss"
                kp_loss_parameters:
                    lambda_weighted_bce: 200
                    focal_alpha: 0.25
                    focal_gamma: 2
                loss_weights:
                    one_view_line_af_weight: 1
                    one_view_line_df_weight: 1
                    two_view_line_df_weight: 1
                    keypoint_weight: 1
                    one_view_descriptor_weight: 1
                    two_view_descriptor_weight: 1
                    softargmax_weight: 0 # if > 0 activates calculation of soft argmax loss on keypoint detection
        line_detection:
            do: False
        checkpoint: null  # if given load model weights from this checkpoint
        timeit: False  # override timeit: False from BaseModel
train:
    load_experiment: null  # initialize the model from a previous experiment (take weights)
    seed: 7
    epochs: 60
    log_every_iter: 8
    eval_every_iter: 15000 # automatically creates new checkpoint if new best eval metric is reached -> set > #batches to not eval except at the end of each epoch
    save_every_iter: 10000
    test_every_epoch: -1
    optimizer: "adam"
    best_key: "loss/total" # key used to determine best checkpoint and evaluation progress
    lr: 0.0001
    lr_schedule:
        type: 'ReduceLROnPlateau'
        on_epoch: True
        options:
            patience: 5
    keep_last_checkpoints: 5
    submodules: []
    #plot: [4, 'gluefactory.datasets.oxford_paris_2view_jpldd.plot_predictions']

